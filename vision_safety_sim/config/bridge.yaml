# ros_gz_bridge configuration
# Gazebo-side topics are namespaced under /vision_bot (set in the robot xacro);
# ROS-side topics use the standard names the rest of the system expects.

# Simulation clock -> every node runs with use_sim_time:=true
- ros_topic_name: "/clock"
  gz_topic_name: "/clock"
  ros_type_name: "rosgraph_msgs/msg/Clock"
  gz_type_name: "gz.msgs.Clock"
  direction: GZ_TO_ROS

# Velocity command into the DiffDrive plugin.
# Later, ONLY safety_monitor will publish /cmd_vel; controllers use /cmd_vel_raw.
- ros_topic_name: "/cmd_vel"
  gz_topic_name: "/vision_bot/cmd_vel"
  ros_type_name: "geometry_msgs/msg/Twist"
  gz_type_name: "gz.msgs.Twist"
  direction: ROS_TO_GZ

- ros_topic_name: "/odom"
  gz_topic_name: "/vision_bot/odom"
  ros_type_name: "nav_msgs/msg/Odometry"
  gz_type_name: "gz.msgs.Odometry"
  direction: GZ_TO_ROS

# odom -> base_footprint transform from DiffDrive
- ros_topic_name: "/tf"
  gz_topic_name: "/vision_bot/tf"
  ros_type_name: "tf2_msgs/msg/TFMessage"
  gz_type_name: "gz.msgs.Pose_V"
  direction: GZ_TO_ROS

# Wheel joint states -> robot_state_publisher
- ros_topic_name: "/joint_states"
  gz_topic_name: "/vision_bot/joint_states"
  ros_type_name: "sensor_msgs/msg/JointState"
  gz_type_name: "gz.msgs.Model"
  direction: GZ_TO_ROS

# Camera
- ros_topic_name: "/camera/image_raw"
  gz_topic_name: "/vision_bot/camera/image_raw"
  ros_type_name: "sensor_msgs/msg/Image"
  gz_type_name: "gz.msgs.Image"
  direction: GZ_TO_ROS

- ros_topic_name: "/camera/camera_info"
  gz_topic_name: "/vision_bot/camera/camera_info"
  ros_type_name: "sensor_msgs/msg/CameraInfo"
  gz_type_name: "gz.msgs.CameraInfo"
  direction: GZ_TO_ROS
