<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" font-family="Helvetica, Arial, sans-serif">
  <title>Ground-plane distance from one pixel row</title>
  <rect width="760" height="330" fill="#ffffff"/>

  <!-- floor -->
  <line x1="20" y1="250" x2="740" y2="250" stroke="#555" stroke-width="2"/>
  <g stroke="#bbb" stroke-width="1">
    <line x1="30" y1="250" x2="20" y2="262"/><line x1="70" y1="250" x2="60" y2="262"/>
    <line x1="110" y1="250" x2="100" y2="262"/><line x1="150" y1="250" x2="140" y2="262"/>
    <line x1="190" y1="250" x2="180" y2="262"/><line x1="230" y1="250" x2="220" y2="262"/>
    <line x1="270" y1="250" x2="260" y2="262"/><line x1="310" y1="250" x2="300" y2="262"/>
    <line x1="350" y1="250" x2="340" y2="262"/><line x1="390" y1="250" x2="380" y2="262"/>
    <line x1="430" y1="250" x2="420" y2="262"/><line x1="470" y1="250" x2="460" y2="262"/>
    <line x1="510" y1="250" x2="500" y2="262"/><line x1="550" y1="250" x2="540" y2="262"/>
    <line x1="590" y1="250" x2="580" y2="262"/><line x1="630" y1="250" x2="620" y2="262"/>
    <line x1="670" y1="250" x2="660" y2="262"/><line x1="710" y1="250" x2="700" y2="262"/>
  </g>

  <!-- robot -->
  <rect x="40" y="196" width="150" height="34" rx="4" fill="#3d434b"/>
  <circle cx="135" cy="236" r="14" fill="#111"/>
  <circle cx="62" cy="243" r="7" fill="#111"/>
  <rect x="172" y="174" width="16" height="16" fill="#e8e8e8" stroke="#3d434b" stroke-width="2"/>
  <text x="70" y="218" fill="#ffffff" font-size="13">robot</text>

  <!-- camera centre -->
  <circle cx="180" cy="182" r="3.5" fill="#1f6fd1"/>

  <!-- obstacle -->
  <rect x="520" y="160" width="90" height="90" fill="#c81e1e"/>
  <text x="530" y="150" fill="#c81e1e" font-size="13">obstacle</text>

  <!-- optical axis (pitched down by theta) -->
  <line x1="180" y1="182" x2="740" y2="268" stroke="#1f6fd1" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="600" y="292" fill="#1f6fd1" font-size="13">optical axis</text>

  <!-- horizontal reference -->
  <line x1="180" y1="182" x2="380" y2="182" stroke="#999" stroke-width="1" stroke-dasharray="3 4"/>

  <!-- ray to the obstacle's floor contact -->
  <line x1="180" y1="182" x2="520" y2="250" stroke="#d14a00" stroke-width="2.5"/>
  <circle cx="520" cy="250" r="5" fill="#d14a00"/>
  <text x="290" y="170" fill="#d14a00" font-size="13">ray through the lowest blob pixel</text>

  <!-- angle arc: theta + alpha, from horizontal down to the ray -->
  <path d="M 300 182 A 120 120 0 0 1 297.7 205.5" fill="none" stroke="#333" stroke-width="1.5"/>
  <text x="306" y="201" fill="#333" font-size="14">θ + α</text>

  <!-- height h -->
  <line x1="184" y1="182" x2="222" y2="182" stroke="#333" stroke-width="1" stroke-dasharray="2 2"/>
  <line x1="214" y1="186" x2="214" y2="246" stroke="#333" stroke-width="1.2"/>
  <polygon points="214,250 210,242 218,242" fill="#333"/>
  <polygon points="214,182 210,190 218,190" fill="#333"/>
  <text x="221" y="224" fill="#333" font-size="15" font-style="italic">h</text>

  <!-- distance d -->
  <line x1="184" y1="282" x2="516" y2="282" stroke="#333" stroke-width="1.2"/>
  <polygon points="180,282 188,278 188,286" fill="#333"/>
  <polygon points="520,282 512,278 512,286" fill="#333"/>
  <line x1="180" y1="268" x2="180" y2="292" stroke="#333" stroke-width="1"/>
  <line x1="520" y1="268" x2="520" y2="292" stroke="#333" stroke-width="1"/>
  <text x="330" y="276" fill="#333" font-size="14" font-style="italic">d</text>

  <!-- formula -->
  <text x="20" y="34" fill="#111" font-size="17" font-weight="bold">d = h / tan(θ + α),   α = atan((v − c_y) / f_y)</text>
  <text x="20" y="58" fill="#444" font-size="13">h, θ: camera height and pitch, read from TF (the robot URDF)</text>
  <text x="20" y="76" fill="#444" font-size="13">f_y, c_y: camera intrinsics from camera_info</text>
  <text x="20" y="94" fill="#444" font-size="13">v: image row of the obstacle's lowest pixel. Repeated for every column of the blob, this gives its floor footprint.</text>
  <text x="20" y="318" fill="#777" font-size="12">Assumes a flat floor and an obstacle resting on it. Side view, not to scale.</text>
</svg>
